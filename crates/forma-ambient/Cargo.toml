[package]
name = "forma-ambient"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"

[[bin]]
name = "forma-ambient"
path = "src/main.rs"

[dependencies]
forma-engine   = { path = "../forma-engine" }
forma-control  = { path = "../forma-control" }
forma-common   = { path = "../forma-common" }
forma-ui       = { path = "../forma-ui" }
fundsp         = { version = "0.23", features = ["files", "fft"] }
cpal           = "0.15"
anyhow         = "1"
eframe         = "0.29"
egui           = "0.29"
midir          = "0.11"
hound          = "3"
rfd            = "0.15"
midly          = "0.5"
