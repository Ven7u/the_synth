[package]
name = "forma-bench"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2021"

[[bin]]
name = "forma-bench"
path = "src/main.rs"

[[bin]]
name = "forma-perf"
path = "src/bin/forma-perf.rs"

[dependencies]
forma-dsp     = { path = "../forma-dsp" }
forma-engine  = { path = "../forma-engine" }
forma-control = { path = "../forma-control" }
fundsp        = { version = "0.23", features = ["files", "fft"] }
