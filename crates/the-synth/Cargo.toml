[package]
name = "the-synth"
version = "0.1.0"
edition = "2021"

[dependencies]
# Dipendenze interne
synth-dsp     = { path = "../synth-dsp" }
synth-engine  = { path = "../synth-engine" }
synth-control = { path = "../synth-control" }
synth-common  = { path = "../synth-common" }

# Dipendenze esterne (spostate dalla root)
fundsp      = { version = "0.23", features = ["files", "fft"] }
cpal        = "0.15"
anyhow      = "1"
eframe      = "0.29"
egui        = "0.29"
midir       = "0.9"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rfd         = "0.15"
